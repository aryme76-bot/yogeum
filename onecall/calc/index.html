<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원콜 요금 계산기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@800;900&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #f3f5f7;
    --surface: #ffffff;
    --ink: #16202a;
    --ink-2: #5b6876;
    --ink-3: #8b96a3;
    --line: #d9dfe6;
    --line-strong: #b8c2cd;
    --accent: #0d6b66;
    --accent-ink: #ffffff;
    --accent-soft: #e1f0ee;
    --caution: #b4451f;
    --caution-soft: #fbeae2;
    --row-alt: #f8fafb;
    --head: #eef2f5;
    --focus: #0d6b66;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f151b;
      --surface: #171f28;
      --ink: #e7ecf1;
      --ink-2: #9aa6b3;
      --ink-3: #6f7c8a;
      --line: #28323d;
      --line-strong: #3b4753;
      --accent: #3fb3ab;
      --accent-ink: #07201e;
      --accent-soft: #19302e;
      --caution: #f0946f;
      --caution-soft: #3a2218;
      --row-alt: #1b242e;
      --head: #1f2934;
      --focus: #3fb3ab;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f151b;
    --surface: #171f28;
    --ink: #e7ecf1;
    --ink-2: #9aa6b3;
    --ink-3: #6f7c8a;
    --line: #28323d;
    --line-strong: #3b4753;
    --accent: #3fb3ab;
    --accent-ink: #07201e;
    --accent-soft: #19302e;
    --caution: #f0946f;
    --caution-soft: #3a2218;
    --row-alt: #1b242e;
    --head: #1f2934;
    --focus: #3fb3ab;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    min-height: 100vh;
  }
  button { font: inherit; cursor: pointer; color: inherit; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  h1, h2, h3 { margin: 0; text-wrap: balance; }
  .num { font-variant-numeric: tabular-nums; }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 36px 20px 80px;
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  /* ---------- 상단 ---------- */
  .head {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px 16px;
  }
  .head h1 { font-family: "Gothic A1", "IBM Plex Sans KR", sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.01em; }
  .head .built { color: var(--ink-3); font-size: 13px; margin: 0; }
  .head a { color: var(--accent); font-size: 13px; }

  /* ---------- 계산 ---------- */
  #calc { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
  .steps { display: flex; flex-direction: column; gap: 12px; }
  .step {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .step h3 { font-size: 13px; font-weight: 700; color: var(--ink-2); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .step h3 .n {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700;
  }
  .step h3 small { font-weight: 500; color: var(--ink-3); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line-strong);
    background: var(--surface);
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .chip:hover { background: var(--row-alt); }
  .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip:disabled { opacity: 0.45; cursor: not-allowed; }
  .tool { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 14px; font-weight: 500; }
  .tool:hover { background: var(--row-alt); }
  .plist { display: flex; flex-direction: column; gap: 6px; }
  .popt {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 2px 14px; align-items: center;
    padding: 9px 12px; border: 1px solid var(--line-strong); border-radius: 9px; background: var(--surface);
    text-align: left; font-size: 14px;
  }
  .popt:hover { background: var(--row-alt); }
  .popt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
  .popt .nm { font-weight: 500; }
  .popt .sub { grid-column: 1 / -1; font-size: 12px; color: var(--ink-2); }
  .popt .amt { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .popt .gift { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .simrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .simrow select { flex: 1 1 220px; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font: inherit; }
  .lines { display: flex; flex-direction: column; gap: 6px; }
  .line {
    display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 9px; font-size: 14px; background: var(--row-alt);
  }
  .line .amt { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .line .gift { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--accent); white-space: nowrap; }
  .line .gift.no { color: var(--ink-3); font-weight: 500; }
  .del { border: 0; background: transparent; color: var(--caution); font-size: 18px; line-height: 1; padding: 4px 8px; border-radius: 6px; }
  .del:hover { background: var(--caution-soft); }
  .checks { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
  .checks label { display: flex; gap: 8px; align-items: flex-start; cursor: pointer; }
  .checks input { margin-top: 3px; }
  .rnote { font-size: 12px; color: var(--ink-3); line-height: 1.5; }
  .sim-open {
    background: var(--surface);
    border: 1px dashed var(--line-strong);
    border-radius: 12px;
    padding: 14px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .sim-open p { margin: 0; font-size: 14px; color: var(--ink-2); }
  .sim-open .go { padding: 10px 18px; border-radius: 9px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .line { grid-template-columns: minmax(0, 1fr) auto auto auto; }
  .line .fee { display: flex; flex-direction: column; align-items: flex-end; font-variant-numeric: tabular-nums; white-space: nowrap; line-height: 1.3; }
  .line .fee .base { font-size: 12px; color: var(--ink-3); text-decoration: line-through; }
  .line .fee .disc { font-weight: 600; }
  .rrow.two { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; }
  .rrow.two span:nth-child(2) { color: var(--ink-3); font-weight: 500; text-decoration: line-through; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .rhead { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; font-size: 11px; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; text-transform: uppercase; }
  .rhead span { white-space: nowrap; }
  .rrow.save span:last-child { color: var(--accent); }
  .result {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
    position: sticky;
    top: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .result h3 { font-size: 14px; font-weight: 700; color: var(--ink-2); }
  .result .pick { font-size: 14px; line-height: 1.5; }
  .rsec { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .rsec .lbl { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  .rrow { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
  .rrow span:first-child { color: var(--ink-2); }
  .rrow span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .rrow.sum { border-top: 1px dashed var(--line-strong); padding-top: 6px; margin-top: 2px; }
  .rrow.sum span:first-child { color: var(--ink); font-weight: 700; }
  .rrow.big span:last-child { font-size: 22px; font-weight: 800; color: var(--accent); }
  .rrow.minus span:last-child { color: var(--caution); }
  .result .empty { color: var(--ink-3); font-size: 14px; padding: 8px 0; }
  .copy-btn { width: 100%; padding: 10px; border-radius: 9px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; }
  .reset-btn { width: 100%; padding: 8px; border-radius: 9px; border: 1px solid var(--line-strong); background: var(--surface); font-size: 13px; }
  @media (max-width: 860px) {
    #calc { grid-template-columns: 1fr; }
    .result { position: static; }
  }
</style>
</head>
<body>

<div class="wrap">

</div>

  var NET = RATES.channels.filter(function (c) { return c.type !== "sim"; });
  var SIM = RATES.channels.filter(function (c) { return c.type === "sim"; })[0] || null;
  var C = { ch: 0, carrier: null, speed: null, product: null, extraTv: 0, bundle: false, simOpen: false, simCarrier: 0, simPlan: 0, sims: [], ded: {} };

  function netCh() { return NET[C.ch]; }
  function carrierObj() { return C.carrier == null ? null : netCh().carriers[C.carrier]; }
  function manWon(n) { return n == null ? "-" : n.toLocaleString("ko-KR") + "만"; }
  function parseMan(text) { var m = /(\d+)\s*만/.exec(text || ""); return m ? Number(m[1]) : null; }
  function deductions(c) {
    if (!c) return [];
    var out = [];
    (c.policy.notes || []).concat(c.policy.extra || []).forEach(function (t) {
      var m = /-\s*(\d+)\s*만\s*원?/.exec(t);
      if (m) out.push({ text: t, man: Number(m[1]) });
    });
    return out;
  }
  function simGiftFor(carrier, plan, lineIndex) {
    // 사은품 열이 여러 개(100M/500M)면 고른 인터넷 속도로 열을 정한다
    var col = 0;
    if (carrier.giftCols.length > 1) {
      var mbps = C.speed ? speedOf(C.speed).mbps : 0;
      col = mbps >= 500 ? carrier.giftCols.length - 1 : 0;
    }
    var raw = plan.gifts[col] || "";
    var man = parseMan(raw);
    var rule = null;
    if (lineIndex > 0) {
      var r = /추가회선\s*(\d+)\s*만\s*원?/.exec(carrier.note || "");
      if (r) { man = man == null ? null : Number(r[1]); rule = "추가회선 " + r[1] + "만원"; }
      else if (/추가회선\s*동일/.test(carrier.note || "")) rule = "추가회선 동일";
    }
    return { raw: raw, man: man, col: carrier.giftCols[col], rule: rule };
  }

  function chip(label, pressed, onClick, disabled) {
    var b = h("button", { type: "button", class: "chip", "aria-pressed": String(!!pressed), text: label });
    if (disabled) b.disabled = true;
    b.addEventListener("click", onClick);
    return b;
  }
  function step(n, title, sub, children) {
    var head = h("h3", null, [h("span", { class: "n", text: String(n) }), title, sub ? h("small", { text: sub }) : null]);
    return h("div", { class: "step" }, [head].concat(children));
  }

  function renderSteps() {
    stepsEl.innerHTML = "";
    var n = 1;
    if (NET.length > 1) {
      stepsEl.appendChild(step(n++, "단가표", null, [h("div", { class: "chips" }, NET.map(function (ch, i) {
        return chip(ch.name, C.ch === i, function () { C.ch = i; C.carrier = null; C.speed = null; C.product = null; C.ded = {}; C.sims = []; renderCalc(); });
      }))]));
    }
    stepsEl.appendChild(step(n++, "통신사", null, [h("div", { class: "chips" }, netCh().carriers.map(function (c, i) {
      return chip(shortName(c.name), C.carrier === i, function () { C.carrier = i; C.speed = null; C.product = null; C.extraTv = 0; C.bundle = false; C.ded = {}; renderCalc(); });
    }))]));
    var car = carrierObj();
    if (car) {
      var seen = {};
      car.products.forEach(function (p) { var sp = speedOf(p.name); seen[sp.label] = sp.mbps; });
      var labels = Object.keys(seen).sort(function (a, b) { return seen[a] - seen[b]; });
      stepsEl.appendChild(step(n++, "인터넷 속도", null, [h("div", { class: "chips" }, labels.map(function (l) {
        return chip(l, C.speed === l, function () { C.speed = l; C.product = null; renderCalc(); });
      }))]));
    }
    if (car && C.speed) {
      var list = car.products.filter(function (p) { return speedOf(p.name).label === C.speed; });
      stepsEl.appendChild(step(n++, "상품", "월요금 · 사은품", [h("div", { class: "plist" }, list.map(function (p) {
        var b = h("button", { type: "button", class: "popt", "aria-pressed": String(C.product === p) }, [
          h("span", { class: "nm", text: p.name }),
          h("span", { class: "amt", text: won(p.monthly) + "원" }),
          h("span", { class: "gift", text: p.gift.total != null ? manWon(p.gift.total) : "-" }),
          h("span", { class: "sub", text: (p.tv == null ? "인터넷 단독" : "TV 포함") + (p.bundle != null ? " · 결합 시 " + won(p.bundle) + "원" : " · 결합 없음") })
        ]);
        b.addEventListener("click", function () { C.product = p; if (p.bundle == null) C.bundle = false; if (p.tv == null) C.extraTv = 0; renderCalc(); });
        return b;
      }))]));
    }
    var prod = C.product;
    if (car && prod) {
      var et = car.policy.extraTv;
      if (prod.tv != null && et && et.monthly != null) {
        stepsEl.appendChild(step(n++, "추가 TV", "대당 월 " + won(et.monthly) + "원" + (car.policy.extraTvLabel ? " · " + car.policy.extraTvLabel.replace("추가티비", "").trim() : ""),
          [h("div", { class: "chips" }, [0, 1, 2].map(function (k) { return chip(k === 0 ? "없음" : k + "대", C.extraTv === k, function () { C.extraTv = k; renderCalc(); }); }))]));
      }
      stepsEl.appendChild(step(n++, "결합", prod.bundle == null ? "이 상품은 결합금액이 없습니다" : "결합 시 월 " + won(prod.bundle) + "원",
        [h("div", { class: "chips" }, [
          chip("결합 안 함", !C.bundle, function () { C.bundle = false; renderCalc(); }),
          chip("결합함", C.bundle, function () { C.bundle = true; renderCalc(); }, prod.bundle == null)
        ])]));
      var deds = deductions(car);
      if (deds.length) {
        stepsEl.appendChild(step(n++, "차감 항목", "해당되면 체크", [h("div", { class: "checks" }, deds.map(function (d, i) {
          var cb = h("input", { type: "checkbox" }); cb.checked = !!C.ded[i];
          cb.addEventListener("change", function () { C.ded[i] = cb.checked; renderResult(); });
          return h("label", null, [cb, h("span", { text: d.text })]);
        }))]));
      }
    }
    if (SIM && !C.simOpen) {
      var go = h("button", { type: "button", class: "go", text: "유심 계산하기" });
      go.addEventListener("click", function () { C.simOpen = true; renderCalc(); var last = stepsEl.lastElementChild; if (last) last.scrollIntoView({ behavior: "smooth", block: "start" }); });
      stepsEl.appendChild(h("div", { class: "sim-open" }, [
        h("p", { text: prod ? "유선 계산이 끝났습니다. 유심 회선을 더해 총 합계를 보려면 누르세요." : "유선 상품을 고른 뒤, 또는 유심만 계산하려면 누르세요." }),
        go
      ]));
    }
    if (SIM && C.simOpen) {
      var sc = SIM.carriers[C.simCarrier] || SIM.carriers[0];
      if (C.simPlan >= sc.plans.length) C.simPlan = 0;
      var sel = h("select", { "aria-label": "요금제 선택" });
      sc.plans.forEach(function (pl, i) {
        var o = h("option", { value: String(i), text: pl.name + " · " + pl.data + " · 기본 " + won(pl.price) + "원 → 선택약정 " + won(pl.discount) + "원 · 사은품 " + (pl.gifts.join("/") || "-") });
        if (i === C.simPlan) o.selected = true;
        sel.appendChild(o);
      });
      sel.addEventListener("change", function () { C.simPlan = Number(sel.value); });
      var add = h("button", { type: "button", class: "tool", text: "+ 회선 추가" });
      add.addEventListener("click", function () { C.sims.push({ carrier: C.simCarrier, plan: C.simPlan }); renderCalc(); });
      var lines = h("div", { class: "lines" }, C.sims.map(function (ln, i) {
        var cc = SIM.carriers[ln.carrier], pl = cc.plans[ln.plan];
        var sameBefore = C.sims.slice(0, i).filter(function (x) { return x.carrier === ln.carrier; }).length;
        var g = simGiftFor(cc, pl, sameBefore);
        var x = h("button", { type: "button", class: "del", text: "\u00d7", "aria-label": "회선 삭제" });
        x.addEventListener("click", function () { C.sims.splice(i, 1); renderCalc(); });
        return h("div", { class: "line" }, [
          h("span", { text: cc.name + " " + pl.name + (g.rule ? " (" + g.rule + ")" : "") }),
          h("span", { class: "fee" }, [h("span", { class: "base", text: won(pl.price) + "원" }), h("span", { class: "disc", text: won(pl.discount) + "원" })]),
          h("span", { class: "gift" + (g.man == null ? " no" : ""), text: g.man == null ? (g.raw || "-") : manWon(g.man) }),
          x
        ]);
      }));
      stepsEl.appendChild(step(n++, "유심", (SIM.basis ? SIM.basis + " · " : "") + "기본요금 → 선택약정 할인가", [
        h("div", { class: "chips" }, SIM.carriers.map(function (c, i) { return chip(c.name, (C.simCarrier || 0) === i, function () { C.simCarrier = i; C.simPlan = 0; renderCalc(); }); })),
        h("div", { class: "simrow" }, [sel, add]),
        h("div", { class: "rnote", text: sc.note || "" }),
        lines
      ]));
    }
  }

  function compute() {
    var car = carrierObj(), prod = C.product;
    var r = { lines: [], monthly: 0, wired: 0, simLines: [], simBase: 0, simDisc: 0, install: null, giftNet: null, giftNetCash: null, giftParts: [], giftSim: 0, ded: 0, notes: [] };
    if (car && prod) {
      var base = C.bundle && prod.bundle != null ? prod.bundle : prod.monthly;
      r.lines.push([C.bundle && prod.bundle != null ? "인터넷+TV (결합)" : "인터넷+TV", base]);
      r.wired += base;
      var et = car.policy.extraTv;
      if (C.extraTv > 0 && et && et.monthly != null) { r.lines.push(["추가 TV " + C.extraTv + "대", et.monthly * C.extraTv]); r.wired += et.monthly * C.extraTv; }
      r.monthly = r.wired;
      var ins = car.policy.install;
      if (ins) {
        if (prod.tv == null) r.install = ins.single;
        else if (C.extraTv === 0) r.install = ins.it;
        else {
          r.install = ins.itt;
          var per = /\+\s*([\d,]+)/.exec(car.policy.installLabel || "");
          if (C.extraTv > 1 && per) r.install += Number(per[1].replace(/,/g, "")) * (C.extraTv - 1);
        }
      }
      r.giftNet = prod.gift.total;
      var cash = prod.gift.parts.filter(function (p) { return p[0] === "현금"; }).reduce(function (a, p) { return a + p[1]; }, 0);
      r.giftNetCash = prod.gift.parts.length ? cash : null;
      r.giftParts = prod.gift.parts;
      deductions(car).forEach(function (d, i) { if (C.ded[i]) r.ded += d.man; });
      (car.policy.extra || []).forEach(function (t) { if (!/-\s*\d+\s*만/.test(t)) r.notes.push(t); });
    }
    C.sims.forEach(function (ln, i) {
      var cc = SIM.carriers[ln.carrier], pl = cc.plans[ln.plan];
      var sameBefore = C.sims.slice(0, i).filter(function (x) { return x.carrier === ln.carrier; }).length;
      var g = simGiftFor(cc, pl, sameBefore);
      r.simLines.push(["유심 " + cc.name + " " + pl.name, pl.price, pl.discount]);
      r.simBase += pl.price || 0;
      r.simDisc += pl.discount || 0;
      r.monthly += pl.discount || 0;
      if (g.man != null) r.giftSim += g.man;
    });
    return r;
  }

  function summaryText() {
    var car = carrierObj(), prod = C.product, r = compute();
    var out = [];
    if (car && prod) out.push("[" + netCh().name + "] " + shortName(car.name) + " " + C.speed + " · " + prod.name);
    r.lines.forEach(function (l) { out.push(l[0] + " " + won(l[1]) + "원"); });
    if (r.simLines.length) {
      if (r.lines.length > 1) out.push("유선 소계 " + won(r.wired) + "원");
      r.simLines.forEach(function (l) { out.push(l[0] + " 기본 " + won(l[1]) + "원 → 선택약정 " + won(l[2]) + "원"); });
      out.push("월 합계 기본요금 기준 " + won(r.wired + r.simBase) + "원 / 선택약정 기준 " + won(r.wired + r.simDisc) + "원 (월 " + won(r.simBase - r.simDisc) + "원 절감)");
    } else if (r.lines.length > 1) out.push("월 합계 " + won(r.monthly) + "원");
    if (r.install != null) out.push("설치비 " + won(r.install) + "원");
    if (r.giftNet != null || r.giftSim) {
      var tot = (r.giftNet || 0) + r.giftSim - r.ded;
      var s2 = "사은품 총 " + manWon(tot);
      if (r.giftNetCash != null) s2 += " (현금 기준 " + manWon(r.giftNetCash + r.giftSim - r.ded) + ")";
      out.push(s2);
    }
    return out.join("\n");
  }

  function renderResult() {
    resultEl.innerHTML = "";
    var car = carrierObj(), prod = C.product, r = compute();
    resultEl.appendChild(h("h3", { text: "계산 결과" }));
    if (!prod && !C.sims.length) {
      resultEl.appendChild(h("div", { class: "empty", text: "통신사와 상품을 고르면 여기에 월요금 · 설치비 · 사은품이 나옵니다." }));
      return;
    }
    if (car && prod) resultEl.appendChild(h("div", { class: "pick" }, [h("b", { text: shortName(car.name) + " " + C.speed }), h("br"), prod.name]));
    var m = h("div", { class: "rsec" }, [h("div", { class: "lbl", text: "월요금" })]);
    r.lines.forEach(function (l) { m.appendChild(h("div", { class: "rrow" }, [h("span", { text: l[0] }), h("span", { text: won(l[1]) + "원" })])); });
    if (r.simLines.length) {
      if (r.lines.length) m.appendChild(h("div", { class: "rrow sum" }, [h("span", { text: "유선 소계" }), h("span", { text: won(r.wired) + "원" })]));
      resultEl.appendChild(m);
      var sm = h("div", { class: "rsec" }, [h("div", { class: "lbl", text: "유심 · 기본요금 → 선택약정" }),
        h("div", { class: "rhead" }, [h("span", { text: "요금제" }), h("span", { text: "기본" }), h("span", { text: "선택약정" })])]);
      r.simLines.forEach(function (l) { sm.appendChild(h("div", { class: "rrow two" }, [h("span", { text: l[0].replace(/^유심 /, "") }), h("span", { text: won(l[1]) + "원" }), h("span", { text: won(l[2]) + "원" })])); });
      sm.appendChild(h("div", { class: "rrow two sum" }, [h("span", { text: "유심 소계" }), h("span", { text: won(r.simBase) + "원" }), h("span", { text: won(r.simDisc) + "원" })]));
      sm.appendChild(h("div", { class: "rrow save" }, [h("span", { text: "선택약정으로 월 절감" }), h("span", { text: "-" + won(r.simBase - r.simDisc) + "원" })]));
      resultEl.appendChild(sm);
      var tm = h("div", { class: "rsec" }, [h("div", { class: "lbl", text: "총 합계 (유선 + 유심)" })]);
      tm.appendChild(h("div", { class: "rrow" }, [h("span", { text: "기본요금 기준" }), h("span", { text: won(r.wired + r.simBase) + "원" })]));
      tm.appendChild(h("div", { class: "rrow sum big" }, [h("span", { text: "선택약정 기준" }), h("span", { text: won(r.wired + r.simDisc) + "원" })]));
      resultEl.appendChild(tm);
    } else {
      m.appendChild(h("div", { class: "rrow sum big" }, [h("span", { text: "월 합계" }), h("span", { text: won(r.monthly) + "원" })]));
      resultEl.appendChild(m);
    }
    if (r.install != null) {
      resultEl.appendChild(h("div", { class: "rsec" }, [h("div", { class: "lbl", text: "설치비" }), h("div", { class: "rrow" }, [h("span", { text: prod.tv == null ? "인터넷 단독" : (C.extraTv ? "인+티+티" : "인+티") }), h("span", { text: won(r.install) + "원" })])]));
    }
    if (r.giftNet != null || C.sims.length) {
      var g = h("div", { class: "rsec" }, [h("div", { class: "lbl", text: "사은품 (만원)" })]);
      if (r.giftNet != null) {
        g.appendChild(h("div", { class: "rrow" }, [h("span", { text: "인터넷·TV" }), h("span", { text: manWon(r.giftNet) })]));
        if (r.giftParts.length) g.appendChild(h("div", { class: "rnote", text: r.giftParts.map(function (p) { return p[0] + " " + p[1]; }).join(" + ") }));
      }
      if (C.sims.length) g.appendChild(h("div", { class: "rrow" }, [h("span", { text: "유심 " + C.sims.length + "회선" }), h("span", { text: manWon(r.giftSim) })]));
      if (r.ded) g.appendChild(h("div", { class: "rrow minus" }, [h("span", { text: "차감" }), h("span", { text: "-" + manWon(r.ded) })]));
      var tot = (r.giftNet || 0) + r.giftSim - r.ded;
      g.appendChild(h("div", { class: "rrow sum big" }, [h("span", { text: "총액" }), h("span", { text: manWon(tot) })]));
      if (r.giftNetCash != null) g.appendChild(h("div", { class: "rrow" }, [h("span", { text: "현금 기준" }), h("span", { text: manWon(r.giftNetCash + r.giftSim - r.ded) })]));
      resultEl.appendChild(g);
    }
    if (r.notes.length) resultEl.appendChild(h("div", { class: "rsec" }, [h("div", { class: "lbl", text: "참고" })].concat(r.notes.map(function (t) { return h("div", { class: "rnote", text: t }); }))));
    var copy = h("button", { type: "button", class: "copy-btn", text: "결과 복사" });
    copy.addEventListener("click", function () {
      var t = summaryText();
      var done = function () { copy.textContent = "복사됨"; setTimeout(function () { copy.textContent = "결과 복사"; }, 1500); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, function () { window.prompt("아래 내용을 복사하세요", t); });
      else window.prompt("아래 내용을 복사하세요", t);
    });
    resultEl.appendChild(copy);
    var reset = h("button", { type: "button", class: "reset-btn", text: "처음부터" });
    reset.addEventListener("click", function () { C.carrier = null; C.speed = null; C.product = null; C.extraTv = 0; C.bundle = false; C.sims = []; C.ded = {}; C.simOpen = false; renderCalc(); window.scrollTo({ top: 0, behavior: "smooth" }); });
    resultEl.appendChild(reset);
  }

  function renderCalc() { renderSteps(); renderResult(); }
  renderCalc();
})();
</script>
</body>
</html>
